[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalgate"
version = "0.1.0"
description = "Offline eval harness for LLM apps with a CI regression gate"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.117.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "typer==0.27.0",
]

[project.scripts]
evalgate = "evalgate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
